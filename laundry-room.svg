<text x="-62" y="167.6" class="note">• The two back walls are not in line: the washer/dryer wall sits 30-3/8" forward of the sink-alcove wall.</text>
<text x="-62" y="173.6" class="note">• A 5-1/4" pier divides them, projecting 43-3/4" into the room — 13-3/8" past the washer/dryer wall.</text>
<text x="-62" y="179.6" class="note">• Foyer door swings in. Garage door swings out into the garage, so it never takes room off this side.</text>
<text x="-62" y="185.6" class="note">⚠ Code keeps 30" wide x 36" deep clear in front of the sub-panel, floor to 6'-6".</text>
<text x="-62" y="191.6" class="note">• RE-MEASURE BEFORE ORDERING: wall B adds up to 127" from the alcove widths but measured 125-7/8" on site.</text>
