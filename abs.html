<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABS Order — Closets</title>
<style>
  :root{--paper:#F3F0E9;--ink:#20201C;--ink-soft:#6A665C;--hair:#C8C2B4;--panel:#FBFAF6;--blue:#1C5C77;--amber:#B5751A;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#17181A;--ink:#ECEAE3;--ink-soft:#9A968B;--hair:#393B35;--panel:#1E2022;--blue:#6FB6CE;--amber:#E9A94B;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Arial,system-ui,sans-serif;line-height:1.5}
  .sheet{max-width:1020px;margin:0 auto;padding:14px 18px 70px}
  .titleblock{border:1.5px solid var(--ink);background:var(--panel);padding:10px 16px}
  .eyebrow{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0}
  h1{font-size:18px;margin:2px 0 4px}
  .lede{margin:0;font-size:13px;color:var(--ink-soft)}
  .lede a{color:var(--blue)}
  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:28px 0 8px;color:var(--blue)}
  h2 .sub{text-transform:none;letter-spacing:0;color:var(--ink-soft);font-weight:400;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);border:1px solid var(--hair)}
  th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
     padding:7px 10px;border-bottom:1px solid var(--hair);font-weight:700}
  td{padding:6px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:nowrap}
  .num{text-align:right}
  .tag{display:inline-block;background:var(--blue);color:var(--panel);border-radius:3px;
       padding:1px 6px;font-size:10.5px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
  tr.gap td{opacity:.95;background:color-mix(in srgb,var(--amber) 11%,transparent)}
  tr.gap .what{color:var(--amber);font-weight:600}
  tr.sum td{border-top:2px solid var(--hair);font-weight:700;background:color-mix(in srgb,var(--blue) 7%,transparent)}
  .grand{margin-top:26px;border:1.5px solid var(--ink);background:var(--panel);padding:12px 16px}
  .grand table{border:0;background:none}
  .grand td{border-bottom:1px solid var(--hair)}
  .note{font-size:12px;color:var(--ink-soft);margin:6px 0 0}
  ol.q{font-size:13px;padding-left:20px}
  ol.q li{margin:6px 0}
  .pill{font-size:11px;border:1px solid var(--hair);border-radius:99px;padding:1px 9px;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="sheet">
  <div class="titleblock">
    <p class="eyebrow">Closets · Aydin Building Supplies</p>
    <h1>ABS order &mdash; everything in one place</h1>
    <p class="lede">Every box the three closets need, against the handwritten quote.
      <a href="index.html">&larr; back to the drawings</a></p>
  </div>
  <div id="out"></div>
</div>
<script type="module" src="js/abs-page.js"></script>
</body>
</html>
