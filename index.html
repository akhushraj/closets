<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closets — Shop Drawings</title>
<style>
  :root{
    --paper:#F3F0E9; --ink:#20201C; --ink-soft:#6A665C; --hair:#C8C2B4; --panel:#FBFAF6;
    --blue:#1C5C77; --blue-soft:#5E93A6; --amber:#F0AC55; --shadow:rgba(40,36,28,.16);
    --wood:#D9BF98; --wood-dk:#B8976A; --wallc:#DFDACE; --floorc:#E9E1D2; --hang:#DCD6EE; --hang-bd:#6E63B3;
    --shelf:#D5E7DF; --shelf-bd:#2E7D65; --hamp:#E9DCC6; --led:#FFC86B; --open:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--paper:#17181A; --ink:#ECEAE3; --ink-soft:#9A968B; --hair:#393B35; --panel:#1E2022;
      --blue:#6FB6CE; --blue-soft:#3E7488; --amber:#E9A94B; --shadow:rgba(0,0,0,.5);
      --wood:#8F7552; --wood-dk:#6E5838; --wallc:#34363B; --floorc:#34302A; --hang:#3A3558; --hang-bd:#AFA9EC;
      --shelf:#23443A; --shelf-bd:#5DCAA5; --hamp:#4A4032; --led:#F2B24E; --open:#111214;}
  }
  :root[data-theme="dark"]{--paper:#17181A; --ink:#ECEAE3; --ink-soft:#9A968B; --hair:#393B35; --panel:#1E2022;
    --blue:#6FB6CE; --blue-soft:#3E7488; --amber:#E9A94B; --shadow:rgba(0,0,0,.5);
    --wood:#8F7552; --wood-dk:#6E5838; --wallc:#34363B; --floorc:#34302A; --hang:#3A3558; --hang-bd:#AFA9EC;
    --shelf:#23443A; --shelf-bd:#5DCAA5; --hamp:#4A4032; --led:#F2B24E; --open:#111214;}

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Arial,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .sheet{max-width:1240px;margin:0 auto;padding:12px 18px 60px}

  .titleblock{border:1.5px solid var(--ink);border-radius:2px;background:var(--panel);display:grid;grid-template-columns:1fr auto;overflow:hidden}
  .tb-main{padding:9px 16px;border-right:1.5px solid var(--ink);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .eyebrow{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0}
  .tb-main h1{font-size:clamp(15px,1.6vw,18px);margin:0;line-height:1.1}
  .tb-main select{font:inherit;font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--hair);border-radius:4px;padding:2px 6px}
  .tblink{font-size:12px;color:var(--blue);text-decoration:none;border:1px solid var(--hair);border-radius:4px;padding:2px 8px;white-space:nowrap}
  .tblink:hover{border-color:var(--blue)}
  .tb-meta{display:grid;grid-auto-flow:column}
  .tb-meta div{padding:5px 12px;border-left:1px solid var(--hair);display:flex;flex-direction:column;font-size:10.5px;justify-content:center}
  .tb-meta div:first-child{border-left:0}
  .tb-meta .k{color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-size:8.5px}
  .tb-meta .v{font-weight:600}
  @media(max-width:760px){.titleblock{grid-template-columns:1fr}.tb-main{border-right:0;border-bottom:1.5px solid var(--ink)}
    .tb-meta{grid-auto-flow:row}.tb-meta div{border-left:0;border-top:1px solid var(--hair);flex-direction:row;justify-content:space-between}}

  .tabs{display:flex;gap:4px;margin-top:10px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap}
  .tabbtn{border:1px solid var(--hair);border-bottom:none;background:var(--panel);color:var(--ink-soft);font:inherit;font-size:11.5px;font-weight:600;padding:5px 11px;cursor:pointer;border-radius:3px 3px 0 0;position:relative;top:1.5px}
  .tabbtn .tag{font-family:ui-monospace,Menlo,monospace;font-size:9px;background:var(--hair);color:var(--ink);padding:0 4px;border-radius:2px;margin-right:5px}
  .tabbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tabbtn.on .tag{background:var(--blue);color:var(--paper)}
  .tabpanel{display:none;padding-top:10px}
  .tabpanel.on{display:block}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
  @media(max-width:980px){.layout{grid-template-columns:1fr}}
  .draw{border:1px solid var(--hair);border-radius:4px;background:var(--panel);padding:12px;overflow-x:auto}
  svg{display:block;width:100%;height:auto}
  #three{height:min(72vh,720px);padding:0;overflow:hidden;position:relative;background:#1c1d20}
  #three .hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:#a9a59b;pointer-events:none}
  .viewbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px}
  .viewbtns button{font:inherit;font-size:11px;border:1px solid #444;background:#26282c;color:#ddd;border-radius:4px;padding:4px 9px;cursor:pointer}
  .sidebtns{position:absolute;right:10px;top:40px;display:flex;gap:6px;align-items:center}
  .sidebtns .lbl{font-size:10px;color:#888;letter-spacing:.06em;text-transform:uppercase}
  .sidebtns button{font:inherit;font-size:11px;border:1px solid #444;background:#26282c;color:#ddd;border-radius:4px;padding:3px 8px;cursor:pointer}
  .sidebtns button.off{opacity:.42;text-decoration:line-through}

  .controls{border:1px solid var(--hair);border-radius:5px;background:var(--panel);padding:4px 12px 12px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
  .cgroup{border-top:1px solid var(--hair);padding-top:8px;margin-top:8px}
  .cgroup:first-child{border-top:0}
  .cgroup h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
  .ctrl{margin-bottom:7px}
  .ctrl label{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-soft);margin-bottom:1px}
  .ctrl label output{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--blue);font-weight:700}
  .ctrl input[type=range]{width:100%;accent-color:var(--blue);margin:0}
  .ctrl input[type=text],.ctrl select{width:100%;font:inherit;font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--hair);border-radius:4px;padding:4px 6px}
  .ctrl.check label{justify-content:flex-start;gap:6px;color:var(--ink);font-size:12px;cursor:pointer}
  .ctrl label span{display:flex;align-items:center;gap:6px;color:var(--ink);cursor:pointer}
  .ctrl label .vals{display:flex;align-items:baseline;gap:7px}
  .ctrl label output.gap{color:var(--ink-soft);font-weight:400;font-size:10.5px}
  .ctrl label output.gap.bad{color:var(--amber);font-weight:700}
  .ctrl.off output,.ctrl.off label span{opacity:.5}
  .ctrl.off input[type=range]{opacity:.35}
  .resetbtn{margin-top:10px;font:inherit;font-size:11.5px;border:1px solid var(--hair);background:var(--paper);color:var(--ink-soft);border-radius:4px;padding:4px 10px;cursor:pointer}

  .elevs{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
  figure.elev{margin:0;border:1px solid var(--hair);border-radius:4px;background:var(--panel);padding:8px 10px}
  figure.elev figcaption{font-size:12px;font-weight:600;margin-bottom:4px;display:flex;gap:6px;align-items:center}
  .dimtxt{color:var(--ink-soft);font-weight:400;font-size:11px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
  .stat{border:1px solid var(--hair);border-radius:4px;background:var(--panel);padding:10px 12px;display:flex;flex-direction:column}
  .stat .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .stat .v{font-size:17px;font-weight:700;color:var(--blue)}
  .stat .s{font-size:11.5px;color:var(--ink-soft)}
  .gcbox{border:1px solid var(--hair);border-radius:4px;background:var(--panel);margin-bottom:12px}
  .gchead{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--hair);font-size:12px}
  .copybtn{font:inherit;font-size:11.5px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);border-radius:4px;padding:3px 10px;cursor:pointer}
  .gctext{margin:0;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap}
  .tblh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 6px}
  .tblwrap{overflow-x:auto;border:1px solid var(--hair);border-radius:4px;background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair)}
  thead th{background:color-mix(in srgb,var(--blue) 12%,var(--panel));font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1.5px solid var(--blue)}
  .tag2{display:inline-block;font-size:10px;font-family:ui-monospace,Menlo,monospace;font-weight:700;padding:1px 6px;border-radius:2px;background:var(--blue);color:var(--paper)}
  details.more{margin-top:14px;border-top:1px solid var(--hair);padding-top:10px}
  details.more>summary{cursor:pointer;font-size:12px;color:var(--ink-soft);letter-spacing:.04em;list-style:none}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::before{content:"▸ ";font-size:10px}
  details.more[open]>summary::before{content:"▾ "}
  details.more>summary:hover{color:var(--ink)}
    .warn{background:color-mix(in srgb,var(--amber) 22%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 55%,var(--hair));border-radius:4px;padding:9px 13px;font-size:12.5px;margin-top:10px}
  .info{color:var(--ink-soft);font-size:12px;margin-top:10px;line-height:1.55}

  /* drawing classes */
  .ob{stroke:var(--ink);fill:none;stroke-width:1}
  .floorline{stroke-width:1.8}
  .dl{stroke:var(--blue);stroke-width:1;fill:none}
  .ext{stroke:var(--blue-soft);stroke-width:.7;fill:none}
  .dt{fill:var(--blue);font-family:ui-monospace,Menlo,monospace;font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
  .lb{fill:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}
  .lb.b{font-weight:700}
  .lbs{fill:var(--ink-soft);font-family:"Helvetica Neue",Arial,sans-serif}
  .lbf{fill:var(--ink);font-family:ui-monospace,Menlo,monospace;font-weight:600}
  .lead{stroke:var(--ink-soft);stroke-width:.7;fill:none}
  .leaddot{fill:var(--ink-soft)}
  .floor{fill:var(--floorc)}
  .wallfill{fill:var(--ink)}
  .nbr{fill:var(--hair);opacity:.45}
  .gap{fill:var(--panel)}
  .leafp{stroke:var(--ink);stroke-width:2.2}
  .swing{stroke:var(--ink-soft);stroke-width:.8;fill:none;stroke-dasharray:4 3}
  .m-hang{fill:var(--hang);stroke:var(--hang-bd);stroke-width:1}
  .m-tower{fill:var(--wood);stroke:var(--wood-dk);stroke-width:1.2}
  .m-shelves{fill:var(--shelf);stroke:var(--shelf-bd);stroke-width:1}
  .m-hamper{fill:var(--hamp);stroke:var(--ink-soft);stroke-width:1}
  .m-band{fill:none;stroke:var(--ink-soft);stroke-width:.8;stroke-dasharray:6 4;stroke-opacity:.5}
  .m-press{fill:#E3E0D8;stroke:var(--ink-soft);stroke-width:1}
  .m-other{fill:var(--hair);stroke:var(--ink-soft);stroke-width:1}
  .hatch{fill:none;stroke:var(--amber);stroke-width:1.4;stroke-dasharray:5 3}
  .headerline{stroke:var(--amber);stroke-width:1.2;stroke-dasharray:7 4;opacity:.9}
  .leafin{fill:color-mix(in srgb,var(--panel) 70%,var(--ink) 8%);stroke:var(--ink-soft);stroke-width:.8}
  .p-cabinet,.p-backboard,.p-outlet{fill:#F1EEE8;stroke:var(--ink);stroke-width:.8}
  .p-rack,.p-ups,.p-device{fill:#3A3D44;stroke:var(--ink);stroke-width:.8}
  .p-desktop{fill:var(--wood);stroke:var(--wood-dk);stroke-width:.7}
  .p-nosing{fill:var(--wood-dk);stroke:var(--ink);stroke-width:.5}
  .p-cleat{fill:var(--wood-dk);opacity:.75}
  .p-casing{fill:#F1EEE8;stroke:var(--ink-soft);stroke-width:.7}
  .wago{fill:#E8A33D;stroke:var(--ink);stroke-width:.6}
  .m-dress{fill:var(--hang);stroke:var(--hang-bd);stroke-width:1}
  .m-cabinets{fill:var(--wood);stroke:var(--wood-dk);stroke-width:1}
  .m-appliance,.m-sink,.m-dresser{fill:#E9E7E2;stroke:var(--ink-soft);stroke-width:1}
  .m-counter{fill:#D8D4CC;stroke:var(--ink-soft);stroke-width:1}
  .m-coats{fill:var(--hang);stroke:var(--hang-bd);stroke-width:1;stroke-dasharray:4 2}
  .m-clear{fill:rgba(220,60,60,.08);stroke:#C0392B;stroke-width:1;stroke-dasharray:5 3}
  .p-appliance,.p-sink,.p-dresser{fill:#EDEBE6;stroke:var(--ink);stroke-width:.8}
  .p-dresserfront{fill:#F6F4F0;stroke:var(--ink-soft);stroke-width:.7}
  .p-counter{fill:#CFCAC0;stroke:var(--ink);stroke-width:.6}
  .p-elpanel{fill:#8C8F94;stroke:var(--ink);stroke-width:.8}
  .p-cabdoor{fill:var(--wood);stroke:var(--ink);stroke-width:.9}
  .m-equip{fill:#4A4E57;stroke:var(--ink-soft);stroke-width:1}
  .m-desk{fill:var(--wood);stroke:var(--wood-dk);stroke-width:1}
  .m-ups{fill:#3A3D44;stroke:var(--ink-soft);stroke-width:1}
  .notes{margin:0 0 12px;padding-left:18px;font-size:12.5px;color:var(--ink)}
  .notes li{margin:4px 0}
  .p-board{fill:#D9D5CC;stroke:var(--ink-soft);stroke-width:.6}
  .ghost{fill:none;stroke:var(--wood-dk);stroke-width:1.1;stroke-dasharray:3 3}
  .rodline{stroke:var(--hang-bd);stroke-width:2;stroke-dasharray:8 4}
  .mdot{fill:var(--blue);stroke:var(--paper);stroke-width:1.5}
  .mline{stroke:var(--blue);stroke-width:1.6;stroke-dasharray:5 3}
  .mbg{fill:var(--panel);stroke:var(--blue);stroke-width:.8}
  .mlbl{fill:var(--blue);font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700}
  .diagpanel{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
  .etag{fill:var(--panel);stroke:var(--blue);stroke-width:1}
  .etagt{fill:var(--blue);font-family:ui-monospace,Menlo,monospace;font-weight:700}
  .wallbg{fill:var(--wallc);stroke:var(--ink);stroke-width:.8}
  .opening{fill:var(--open);stroke:var(--ink);stroke-width:1}
  .leaf{fill:none;stroke:var(--ink-soft);stroke-width:.8;stroke-dasharray:5 3}
  .swingel{fill:none;stroke:var(--ink-soft);stroke-width:.7;stroke-dasharray:5 3}
  .p-carcass,.p-shelf{fill:var(--wood);stroke:var(--wood-dk);stroke-width:.7}
  .p-front{fill:var(--wood);stroke:var(--ink);stroke-width:.9}
  .p-pull{fill:var(--ink)}
  .p-kick{fill:var(--ink-soft)}
  .p-rod{fill:#9a9a9a;stroke:var(--ink);stroke-width:.4}
  .p-led{fill:var(--led)}
  .p-hamper{fill:var(--hamp);stroke:var(--ink-soft);stroke-width:.8}
  .p-garment{stroke:rgba(0,0,0,.25);stroke-width:.4;opacity:.9}
  .g0{fill:#2f3b4c}.g1{fill:#6b7f8e}.g2{fill:#d9d4c7}.g3{fill:#8b3a3a}.g4{fill:#3d5a45}.g5{fill:#1f1f22}.g6{fill:#a8927a}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div class="sheet">
  <div class="titleblock">
    <div class="tb-main">
      <p class="eyebrow" id="eyebrow">Closets · Shop Drawing Set</p>
      <h1 id="title">Rohan's Closet — Bedroom 2</h1>
      <select id="closetPick" aria-label="Closet"></select>
      <a class="tblink" href="measurements.html">Field measurements →</a>
    </div>
    <div class="tb-meta mono" id="meta"></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tabbtn on" data-tab="p3d"><span class="tag">3D</span>Room view</button>
    <button class="tabbtn" data-tab="pPlan"><span class="tag">A-1</span>Plan</button>
    <button class="tabbtn" data-tab="pElev"><span class="tag">A-2</span>Elevations</button>
    <button class="tabbtn" data-tab="pSched"><span class="tag">A-3</span>Drawer schedule</button>
    <button class="tabbtn" data-tab="pWiring" hidden><span class="tag">A-4</span>LED wiring</button>
  </div>

  <div class="layout">
    <div>
      <section class="tabpanel on" id="p3d">
        <div class="draw" id="three">
          <div class="viewbtns"><button data-view="overview">Overview</button><button data-view="door">From the door</button><button data-toggle="walls">Hide walls</button></div>
          <div class="sidebtns" id="sidebtns"></div>
          <span class="hint">Drag to orbit · scroll to zoom · right-drag to pan</span>
        </div>
      </section>
      <section class="tabpanel" id="pPlan"><div class="draw"><svg id="plan" role="img" aria-label="Closet plan view"></svg></div></section>
      <section class="tabpanel" id="pElev"><div class="elevs" id="elevs"></div></section>
      <section class="tabpanel" id="pSched"><div id="sched"></div></section>
      <section class="tabpanel" id="pWiring"><div class="draw"><svg id="wiring" role="img" aria-label="LED wiring diagram"></svg></div></section>
    </div>
    <aside class="controls" id="controls" aria-label="Design controls"></aside>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
